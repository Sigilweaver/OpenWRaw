[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "openwraw"
description = "Python bindings for the OpenWRaw Waters MassLynx RAW file parser"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [{ name = "Nathan Riley", email = "git@nathanriley.com" }]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dynamic = ["version"]

[tool.maturin]
features = ["pyo3/extension-module"]
manifest-path = "crates/openwraw-py/Cargo.toml"
include = [
    { path = "LICENSE", format = "sdist" },
    { path = "README.md", format = "sdist" },
    { path = "CHANGELOG.md", format = "sdist" },
    { path = "README.md", format = "wheel" },
]

[project.urls]
Homepage = "https://sigilweaver.app/openwraw/"
Documentation = "https://sigilweaver.app/openwraw/docs/"
Source = "https://github.com/Sigilweaver/OpenWRaw"
Changelog = "https://github.com/Sigilweaver/OpenWRaw/blob/main/CHANGELOG.md"
Issues = "https://github.com/Sigilweaver/OpenWRaw/issues"
