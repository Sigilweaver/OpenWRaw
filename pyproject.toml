[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "openwraw"
description = "Python bindings for the OpenWRaw Waters MassLynx RAW file parser"
keywords = ["mass-spectrometry", "waters", "masslynx", "raw", "proteomics"]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Nathan Riley", email = "git@nathanriley.com" }]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dynamic = ["version"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.maturin]
features = ["pyo3/extension-module"]
manifest-path = "crates/openwraw-py/Cargo.toml"
include = [
    { path = "LICENSE", format = "sdist" },
    { path = "README.md", format = "sdist" },
]

[project.urls]
Homepage = "https://sigilweaver.app/openwraw/"
Documentation = "https://sigilweaver.app/openwraw/docs/"
Source = "https://github.com/Sigilweaver/OpenWRaw"
Changelog = "https://github.com/Sigilweaver/OpenWRaw/blob/main/CHANGELOG.md"
Issues = "https://github.com/Sigilweaver/OpenWRaw/issues"
