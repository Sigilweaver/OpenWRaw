name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Small public Waters MassLynx .raw bundle (~5 MB zipped) from PRIDE
  # PXD058812, used by the rust job's conformance test, the python job's
  # pytest suite, and the mzML schema-validation job. Waters .raw is a
  # directory bundle, distributed on PRIDE as a .raw.zip.
  WATERS_ZIP_URL: >-
    https://ftp.pride.ebi.ac.uk/pride/data/archive/2025/05/PXD058812/ITEM_M11_7_His_tag_01.raw.zip
  WATERS_BUNDLE: ITEM_M11_7_His_tag_01.raw

jobs:
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Download and unzip Waters sample
        if: runner.os != 'Windows'
        run: |
          wget -q --user-agent="OpenWRaw-CI/1.0" -O waters.raw.zip "$WATERS_ZIP_URL"
          unzip -q waters.raw.zip
          test -d "$WATERS_BUNDLE" || (echo "expected bundle dir $WATERS_BUNDLE missing" && exit 1)

      - name: cargo test
        run: cargo test --workspace

  python:
    name: python (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Create virtualenv
        run: python -m venv .venv

      - name: Set venv paths (Unix)
        if: runner.os != 'Windows'
        run: |
          echo "VENV_PYTHON=.venv/bin/python" >> "$GITHUB_ENV"
          echo "VENV_PIP=.venv/bin/pip" >> "$GITHUB_ENV"

      - name: Set venv paths (Windows)
        if: runner.os == 'Windows'
        run: |
          echo "VENV_PYTHON=.venv\Scripts\python.exe" >> $env:GITHUB_ENV
          echo "VENV_PIP=.venv\Scripts\pip.exe" >> $env:GITHUB_ENV

      - name: Install maturin and pytest
        run: ${{ env.VENV_PIP }} install maturin pytest

      - name: Build extension
        run: ${{ env.VENV_PYTHON }} -m maturin develop --release

      - name: Smoke import
        run: ${{ env.VENV_PYTHON }} -c "import openwraw; print(openwraw.__name__)"

      - name: Download and unzip Waters sample
        if: runner.os != 'Windows'
        run: |
          wget -q --user-agent="OpenWRaw-CI/1.0" -O waters.raw.zip "$WATERS_ZIP_URL"
          unzip -q waters.raw.zip
          test -d "$WATERS_BUNDLE" || (echo "expected bundle dir $WATERS_BUNDLE missing" && exit 1)

      - name: pytest
        if: runner.os != 'Windows'
        env:
          OPENWRAW_TEST_BUNDLE: ${{ github.workspace }}/${{ env.WATERS_BUNDLE }}
        run: ${{ env.VENV_PYTHON }} -m pytest tests/ -v

  fuzz:
    name: fuzz (build + seed corpus smoke run)
    runs-on: ubuntu-latest
    env:
      # Unset the workflow-level `-D warnings`: cargo-fuzz appends the
      # inherited RUSTFLAGS to its own sanitizer/coverage instrumentation
      # flags rather than replacing them, so on the nightly toolchain this
      # job builds with, a new nightly-only lint (in this crate or a
      # dependency) would hard-fail CI even when the stable-toolchain jobs
      # stay clean.
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v7

      - name: Install nightly Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "fuzz -> target"

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Build fuzz target
        run: cargo +nightly fuzz build

      - name: Run against the tracked seed corpus (no mutation)
        run: cargo +nightly fuzz run fuzz_reader fuzz/seed_corpus -- -runs=0

  validate-mzml:
    name: mzML XSD validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build to_mzml example (release)
        run: cargo build --release --example to_mzml

      - name: Ensure xmllint is available
        run: command -v xmllint || (sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils)

      - name: Download and unzip Waters sample
        run: |
          wget -q --user-agent="OpenWRaw-CI/1.0" -O waters.raw.zip "$WATERS_ZIP_URL"
          echo "Downloaded $(du -sh waters.raw.zip | cut -f1) zip"
          unzip -q waters.raw.zip
          test -d "$WATERS_BUNDLE" || (echo "expected bundle dir $WATERS_BUNDLE missing" && exit 1)

      - name: Convert Waters .raw to mzML (plain + indexed)
        run: |
          ./target/release/examples/to_mzml "$WATERS_BUNDLE" waters.mzML
          ./target/release/examples/to_mzml "$WATERS_BUNDLE" waters_indexed.mzML --indexed
          echo "plain: $(wc -l < waters.mzML) lines, indexed: $(wc -l < waters_indexed.mzML) lines"

      - name: Validate against PSI-MS XSD
        run: |
          xmllint --noout --schema schema/mzML1.1.0.xsd waters.mzML
          xmllint --noout --schema schema/mzML1.1.2_idx.xsd waters_indexed.mzML

  docs:
    name: Docs (Docusaurus)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: bun install
        run: bun install --frozen-lockfile
      - name: bun run build:cloudflare
        run: bun run build:cloudflare

