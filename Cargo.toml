[workspace]
resolver = "2"
members = ["crates/openwraw", "crates/openwraw-py"]

[workspace.package]
version = "1.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["Nathan Riley <git@nathanriley.com>"]
license = "Apache-2.0"
repository = "https://github.com/Sigilweaver/OpenWRaw"
homepage = "https://sigilweaver.app/openwraw/"
documentation = "https://sigilweaver.app/openwraw/docs/"
keywords = ["mass-spectrometry", "waters", "masslynx", "raw", "proteomics"]
categories = ["parser-implementations", "science"]

[workspace.dependencies]
openwraw = { path = "crates/openwraw" }
openproteo-core = "1.0.0"
pyo3 = { version = "0.28.3", features = ["extension-module"] }

[workspace.lints.rust]
unsafe_code = "forbid"
