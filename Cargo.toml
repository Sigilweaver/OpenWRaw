[workspace]
resolver = "2"
members = ["crates/openwraw", "crates/openwraw-py"]
exclude = ["fuzz"]

[workspace.package]
version = "5.0.0"
edition = "2021"
rust-version = "1.88"
authors = ["Nathan Riley <git@nathanriley.com>"]
license = "Apache-2.0"
repository = "https://github.com/Sigilweaver/OpenWRaw"
homepage = "https://sigilweaver.app/openwraw/"
documentation = "https://sigilweaver.app/openwraw/docs/"
keywords = ["mass-spectrometry", "waters", "masslynx", "raw", "proteomics"]
categories = ["parser-implementations", "science"]

[workspace.dependencies]
openwraw = { path = "crates/openwraw" }
openmassspec-core = "4.0.0"
pyo3 = { version = "0.29.0", features = ["extension-module", "abi3-py310"] }
log = "0.4"
pyo3-log = "0.13"

[workspace.lints.rust]
unsafe_code = "forbid"

# Core 4.0.0 is not on crates.io yet. Pinned by commit; drop this table and
# build against the published 4.0.0 before merging.
[patch.crates-io]
openmassspec-core = { git = "https://github.com/Sigilweaver/OpenMassSpecCore", rev = "ab7b7f7851cc26e518688d04a144c7fc0c42afd5" }
